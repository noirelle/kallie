services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: kallie-api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      - PORT=3001
    volumes:
      - ./services/api/certs:/app/certs:ro
    networks:
      - kallie-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: kallie-agent
    restart: unless-stopped
    env_file:
      - ./services/agent/.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kallie-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: https://${WEB_DOMAIN}/api
    container_name: kallie-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    environment:
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kallie-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: kallie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - WEB_DOMAIN=${WEB_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - kallie-net

networks:
  kallie-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
