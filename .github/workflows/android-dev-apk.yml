name: Android Debug APK (Hot Reload Dev Build)

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Compile arm64-v8a Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-debug-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-debug-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Decode google-services.json for Android FCM
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
          test -s google-services.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Prebuild and compile arm64-v8a Debug APK
        working-directory: apps/mobile
        env:
          EXPO_ENABLE_ANDROID_FCM: "true"
          EXPO_ANDROID_ARCHS: "arm64-v8a"
          EXPO_PUBLIC_SUPABASE_URL: https://jarngfflviwytnwvznps.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_j3oBK4qkMK_BY32hOYsw2A_FeN7-M0H
          EXPO_PUBLIC_API_URL: https://kallie.nozorin.com/api
          EXPO_PUBLIC_GITHUB_REPO: noirelle/kallie
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew app:assembleDebug -x lint -x test --build-cache -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/debug/app-debug.apk ../kallie-debug.apk
          ls -lh ../kallie-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kallie-debug-apk
          path: apps/mobile/kallie-debug.apk
          retention-days: 14
