name: Android Emulator Verification

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to APK to test"
        required: false
        default: "https://github.com/noirelle/kallie/releases/download/v0.1.1/kallie-v0.1.1.apk"
      api_level:
        description: "Android API level"
        required: false
        default: "34"
      test_email:
        description: "Optional test account email for interactive flow"
        required: false
        default: ""
      test_password:
        description: "Optional test account password for interactive flow"
        required: false
        default: ""

jobs:
  emulator-test:
    name: Boot Emulator & Verify APK Launch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        run: |
          curl -fSL "${{ inputs.apk_url }}" -o app-test.apk
          ls -lh app-test.apk

      - name: Run APK on Android Emulator & Capture Logcat
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
          TEST_PASSWORD: ${{ inputs.test_password }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash infra/test/verify-apk-emulator.sh app-test.apk

      - name: Upload Emulator Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            emulator-screen-*.png
            full-logcat.txt
          if-no-files-found: ignore
