name: Android APK GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  android-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK via EAS and download artifact
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          BUILD_JSON=$(eas build --profile preview --platform android --non-interactive --wait --json)
          APK_URL=$(echo "$BUILD_JSON" | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); const item = Array.isArray(d) ? d[0] : d; console.log(item?.artifacts?.buildUrl || item?.artifacts?.applicationArchiveUrl || '');")
          if [ -z "$APK_URL" ]; then
            echo "ERROR: Could not extract APK download URL from EAS output."
            echo "$BUILD_JSON"
            exit 1
          fi
          curl -fSL "$APK_URL" -o "kallie-${TAG}.apk"
          ls -lh "kallie-${TAG}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.eas.outputs.tag }}
          name: Kallie ${{ steps.eas.outputs.tag }}
          generate_release_notes: true
          files: apps/mobile/kallie-${{ steps.eas.outputs.tag }}.apk
