name: Android APK GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Lightweight Serverless APK & Verify on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Build signed Android APK locally on runner
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          APK_FILE="kallie-${TAG}.apk"
          echo "apk_file=${APK_FILE}" >> "$GITHUB_OUTPUT"

          eas build --profile preview --platform android --local --non-interactive --output "${APK_FILE}"

          ls -lh "${APK_FILE}"
          SIZE_BYTES=$(stat -c%s "${APK_FILE}")
          echo "APK size bytes: ${SIZE_BYTES}"

      - name: Publish GitHub Release with Verified APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Kallie ${{ steps.build.outputs.tag }}
          generate_release_notes: true
          files: apps/mobile/${{ steps.build.outputs.apk_file }}
