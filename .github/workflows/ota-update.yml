name: Kallie OTA Auto-Update

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"

jobs:
  ota-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish OTA update to preview and production branches
        run: |
          eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
          eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
